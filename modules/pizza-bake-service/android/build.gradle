// The SDK 57 shape for a local Expo module. `expo-module-gradle-plugin`
// applies com.android.library, kotlin-android and maven-publish, pins the
// Kotlin stdlib, adds expo-modules-core as a compileOnly dependency, and takes
// compileSdk/minSdk/targetSdk from the app — so none of that is repeated here,
// and the module can never drift from the app's SDK levels.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.pizzabakeservice'
version = '1.0.0'

android {
  namespace "expo.modules.pizzabakeservice"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // NotificationCompat, for the ongoing bake notification.
  implementation "androidx.core:core-ktx:1.13.1"
}
