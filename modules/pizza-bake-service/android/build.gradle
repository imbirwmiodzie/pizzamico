// SDK 57 form: expo-module-gradle-plugin supplies Kotlin, compile/target/min
// SDK, the JVM target and the expo-modules-core dependency. The older
// `apply from: ExpoModulesCorePlugin.gradle` setup fails on Gradle 9 with
// "SoftwareComponent with name 'release' not found".
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.pizzabakeservice'
version = '1.0.0'

android {
  namespace "expo.modules.pizzabakeservice"
  // Required by expo-module-gradle-plugin's publishing setup.
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.13.1"
}
