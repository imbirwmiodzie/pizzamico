# Spends one of the fifteen free Android builds a month, so it only runs when
# a change is actually native: the manifest, the dependency set, a config
# plugin, or the local module's Kotlin. Everything else goes out over the air
# through update.yml.
name: Build (native change)

on:
  push:
    branches: [main]
    paths:
      - app.json
      - eas.json
      - package.json
      - package-lock.json
      - plugins/**
      - modules/**
  workflow_dispatch:

jobs:
  build:
    name: Android preview APK
    runs-on: ubuntu-latest
    # Job-level so the steps below can branch on whether the secret exists.
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The domain rules and the types are cheap to check and expensive to get
      # wrong once an APK is in someone's hand.
      - run: npm test
      - run: npm run lint

      - name: No EXPO_TOKEN
        if: env.EXPO_TOKEN == ''
        run: |
          echo "::warning::Checks passed, but there is no EXPO_TOKEN secret so nothing was built."
          echo "Create an access token at https://expo.dev/settings/access-tokens and add it"
          echo "under Settings → Secrets and variables → Actions as EXPO_TOKEN."

      - uses: expo/expo-github-action@v8
        if: env.EXPO_TOKEN != ''
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Link the EAS project
        if: env.EXPO_TOKEN != ''
        run: ./scripts/eas-bootstrap.sh

      - name: Build
        if: env.EXPO_TOKEN != ''
        run: eas build --platform android --profile preview --non-interactive --no-wait
