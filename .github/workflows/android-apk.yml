# Builds an installable Android APK on GitHub's own runners: `expo prebuild`
# then Gradle. No EAS account, token or monthly build quota is involved.
#
#   push / PR       → tests + typecheck, then an APK attached to the run
#   tag v*          → the same, plus a GitHub Release with the APK
#   manual run      → choose `release` (standalone) or `debug` (dev client)
#
# Signing: with the four ANDROID_KEYSTORE_* secrets set, the APK is signed
# with your key. Without them it carries the Expo template's committed debug
# key — installable, and consistent between builds so updates install over
# each other, but not something to publish to a store.

name: Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      variant:
        description: 'release = standalone APK, debug = dev client for `expo start --dev-client`'
        type: choice
        options: [release, debug]
        default: release

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Nearly every phone in use is arm64. Each extra ABI roughly doubles the
  # native compile (Skia, Reanimated). Add x86_64 for emulators if needed.
  ABIS: arm64-v8a

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --ci
      - run: npm run lint

  apk:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # only used by the release step on tags
    env:
      VARIANT: ${{ inputs.variant || 'release' }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Gradle 9 (what Expo SDK 57's template ships) needs JDK 17+.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - run: npm ci

      # Monotonic versionCode so each CI build installs over the previous one.
      # Only the CI checkout is touched; app.json in the repo stays at 1.
      - name: Stamp versionCode
        run: |
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.android.versionCode = Number(process.env.GITHUB_RUN_NUMBER);
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
          '

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install --clean
        env:
          CI: 1

      - name: Gradle assemble
        working-directory: android
        run: |
          task=assemble${VARIANT^}
          ./gradlew "$task" \
            -PreactNativeArchitectures="$ABIS" \
            --no-daemon --stacktrace

      - name: Sign with release key
        if: env.VARIANT == 'release' && env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          ks="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_B64" | base64 -d > "$ks"
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$bt/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" sign \
            --ks "$ks" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out "$apk" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" verify --print-certs "$apk"
          rm -f "$ks"

      - name: Name the APK
        id: apk
        run: |
          version=$(node -p 'require("./app.json").expo.version')
          name="pizza-timer-${version}-${VARIANT}-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}.apk"
          mkdir -p dist
          cp "android/app/build/outputs/apk/${VARIANT}/app-${VARIANT}.apk" "dist/$name"
          echo "path=dist/$name" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
