# The everyday path: UI, timer rules, copy and voice parsing all ship over the
# air to an installed APK and spend no build quota. Deliberately the inverse of
# build.yml's paths — a push takes one route or the other, never both.
name: Update (over the air)

on:
  push:
    branches: [main]
    paths-ignore:
      - app.json
      - eas.json
      - package.json
      - package-lock.json
      - plugins/**
      - modules/**
      - '**/*.md'
  workflow_dispatch:

jobs:
  update:
    name: Publish EAS Update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run lint

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: eas update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::warning::No EXPO_TOKEN secret — skipping the update. Add one under Settings → Secrets → Actions."
            exit 0
          fi
          # The runtime version is on the fingerprint policy, so this only
          # reaches builds whose native side matches this commit.
          npx eas update --branch preview --message "${{ github.event.head_commit.message }}" --non-interactive
