# The everyday path: UI, timer rules, copy and voice parsing all ship over the
# air to an installed APK and spend no build quota. Deliberately the inverse of
# build.yml's paths — a push takes one route or the other, never both.
name: Update (over the air)

on:
  push:
    # `main` is where this lands eventually; the claude/** branch is where it
    # is being built right now, so a push there gets an APK without waiting on
    # a merge. Drop the second entry once main is the default.
    branches: [main, 'claude/**']
    paths-ignore:
      - app.json
      - eas.json
      - package.json
      - package-lock.json
      - plugins/**
      - modules/**
      - '**/*.md'
  workflow_dispatch:

jobs:
  update:
    name: Publish EAS Update
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run lint

      - name: No EXPO_TOKEN
        if: env.EXPO_TOKEN == ''
        run: |
          echo "::warning::Checks passed, but there is no EXPO_TOKEN secret so nothing was published."

      - uses: expo/expo-github-action@v8
        if: env.EXPO_TOKEN != ''
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Link the EAS project
        if: env.EXPO_TOKEN != ''
        run: ./scripts/eas-bootstrap.sh

      - name: Publish
        if: env.EXPO_TOKEN != ''
        # The runtime version is on the fingerprint policy, so this only
        # reaches builds whose native side matches this commit.
        run: eas update --branch preview --message "${{ github.event.head_commit.message || github.sha }}" --non-interactive
