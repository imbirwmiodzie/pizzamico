# Deliberately has no `on:` trigger — free accounts get fifteen Android builds
# a month, and a build should be a decision, not a side effect of a push. Run
# it from the project's Workflows tab on expo.dev, or with
# `eas workflow:run .eas/workflows/build-android.yml`.
#
# The preview profile in eas.json builds an APK with internal distribution, so
# the result is a link you can install from the phone directly.
name: Build Android preview

jobs:
  build_android:
    name: Build Android APK
    type: build
    params:
      platform: android
      profile: preview
