# The everyday path: JS, UI, timer rules, copy and voice parsing ship over the
# air to an already-installed APK and spend no build quota.
#
# Published to the `preview` EAS branch rather than the git branch, because
# that is the channel the preview build subscribes to. `runtimeVersion` is on
# the fingerprint policy, so an update only reaches a build whose native side
# matches this commit — change the Kotlin module or a native dependency and
# this becomes a no-op until a new build exists, which is the correct
# behaviour rather than a bug.
name: Publish update

on:
  push:
    branches: ['main', 'claude/**']

jobs:
  publish_preview_update:
    name: Publish preview update
    type: update
    params:
      branch: preview
      platform: android
